apiVersion: apps/v1
kind: Deployment

metadata:
  name: fraud-api
  namespace: fraud-detection

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fraud-api

  template:
    metadata:
      labels:
        app: fraud-api

    spec:
      containers:
        - name: fraud-api
          image: kashish1303/fraud-detection-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
