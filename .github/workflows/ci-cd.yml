name: Fraud Detection CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify application imports
        run: |
          python -c "from app import app; print('FastAPI application loaded successfully')"

      - name: Build API Docker image
        run: |
          docker build -t fraud-detection-api:ci .

      - name: Build Streamlit UI Docker image
        run: |
          docker build -f Dockerfile.ui -t fraud-detection-ui:ci .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_kp }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}